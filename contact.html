<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hackhim | Contact Us</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="contact-page" data-testid="test-contact-page">
      <h1>Contact Us</h1>
      <p>Get in touch with me via a message</p>
      <!-- FORM -->
      <p
        id="success-msg"
        data-testid="test-contact-success"
        class="success-message"
        hidden
      >
        ✅ Message sent successfully! Thank you for reaching out.
      </p>
      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            data-testid="test-contact-name"
            aria-describedby="error-name"
          />
          <span
            id="error-name"
            data-testid="test-contact-error-name"
            class="error-message"
            aria-live="polite"
          ></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            data-testid="test-contact-email"
            aria-describedby="error-email"
          />
          <span
            id="error-email"
            data-testid="test-contact-error-email"
            class="error-message"
            aria-live="polite"
          ></span>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            data-testid="test-contact-subject"
            aria-describedby="error-subject"
          />
          <span
            id="error-subject"
            data-testid="test-contact-error-subject"
            class="error-message"
            aria-live="polite"
          ></span>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            rows="5"
            data-testid="test-contact-message"
            aria-describedby="error-message"
          ></textarea>
          <span
            id="error-message"
            data-testid="test-contact-error-message"
            class="error-message"
            aria-live="polite"
          ></span>
        </div>

        <button type="submit" data-testid="test-contact-submit">
          Send Message
        </button>
      </form>
    </main>

    <script src="contact.js"></script>
  </body>
</html>
